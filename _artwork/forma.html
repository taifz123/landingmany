<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forma concept artwork</title>
    <link rel="stylesheet" href="study.css" />
    <style>
      .page {
        background: #edece5;
        color: #f9f8f1;
      }
      .arch {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background:
          linear-gradient(0deg, #151c1680, transparent 62%, #19201966),
          url("architecture-concept.webp") center 53% / cover;
      }
      header {
        border-bottom: 1px solid #ffffff77;
        margin: 0 4%;
        padding: 17px 0;
      }
      .logo {
        font: 500 48px s;
        letter-spacing: -4px;
      }
      .copy {
        padding: 40px 4% 30px;
      }
      .title {
        font: normal 104px/0.89 n;
        letter-spacing: -5px;
        margin: 20px 0 10px;
      }
      .row b {
        font-weight: 400;
        font-size: 30px;
      }
      footer {
        height: 15vh;
        color: #2e332b;
        gap: 25px;
      }
      footer em {
        font: 32px n;
        letter-spacing: -1px;
      }
      @media (max-width: 500px) {
        .arch {
          background-position: 54% center;
        }
        .logo {
          font-size: 40px;
        }
        .title {
          font-size: 78px;
        }
        .copy {
          padding: 25px 6%;
        }
        footer em {
          font-size: 24px;
        }
        footer .micro:last-child {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="arch">
        <header>
          <span class="logo">forma.</span>
          <nav>
            Studio &nbsp;&nbsp;&nbsp; Projects &nbsp;&nbsp;&nbsp; Contact ↗
          </nav>
          <span class="mobile">Menu ☰</span>
        </header>
        <div class="copy">
          <span class="micro">Residential architecture</span>
          <div class="row">
            <div class="title">Spaces for<br /><i>slower living.</i></div>
            <b>↘</b>
          </div>
        </div>
      </div>
      <footer>
        <span class="micro">Project 01 / 03</span><em>Courtyard House</em
        ><span class="micro">View project &nbsp; ↗</span>
      </footer>
    </div>
  </body>
</html>
